name: Build CuHotbar

on:
  push:
    branches: ["**"]
    paths:
      - "**.cs"
      - "**.csproj"
      - "references/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Release
        shell: pwsh
        run: dotnet build CuHotbar.csproj -c Release --nologo --no-incremental

      - name: Build Debug
        shell: pwsh
        run: dotnet build CuHotbar.csproj -c Debug --nologo --no-incremental

      - name: Upload CuHotbar (Release)
        uses: actions/upload-artifact@v4
        with:
          name: CuHotbar
          path: |
            bin/Release/CuHotbar.dll
            bin/Release/CuHotbar.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Upload CuHotbar (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: CuHotbar-Debug
          path: |
            bin/Debug/CuHotbar.dll
            bin/Debug/CuHotbar.pdb
          if-no-files-found: error
          retention-days: 30
